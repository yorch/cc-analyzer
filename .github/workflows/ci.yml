name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      matrix:
        # macOS leg exercises the platform we ship darwin binaries for.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Changesets compares a pull request to its base branch.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & format check
        run: bun run lint

      - name: Typecheck (core/CLI/TUI/web-server)
        run: bun run typecheck

      - name: Typecheck (web SPA)
        run: bun run typecheck:web

      - name: Test
        run: bun test

      - name: Build (SPA embed + single binary)
        run: bun run build

      # The version PR consumes changesets, so it intentionally has none.
      - name: Changeset present
        if: >-
          github.event_name == 'pull_request' &&
          !startsWith(github.head_ref, 'changeset-release/')
        run: bun run changeset status --since=origin/${{ github.base_ref }}
